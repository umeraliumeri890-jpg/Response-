# Optional: only keeps the Streamlit dashboard warm for humans.
# Does NOT run WhatsApp alerts — see otp_alert_worker.yml for that.
name: Keep App Alive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit app (dashboard only)
        run: |
          set -e
          URL="${{ secrets.STREAMLIT_APP_URL }}"
          if [ -z "$URL" ]; then
            URL="https://leveluts.streamlit.app/"
          fi
          echo "Pinging $URL"
          # Follow redirects; accept any 2xx/3xx. This never executes Streamlit Python.
          code=$(curl -sS -L -o /dev/null -w "%{http_code}" --max-time 30 "$URL" || true)
          echo "HTTP $code"
          case "$code" in
            2*|3*) exit 0 ;;
            *) exit 0 ;;  # never fail the schedule just because app is cold
          esac
