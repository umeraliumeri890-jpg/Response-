name: Keep App Alive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping App
        run: |
          echo "⏰ $(date): Pinging app..."
          curl -v -L "https://leveluts.streamlit.app/?auto_login=true&code=UTS-ADMIN001"
          echo "✅ $(date): Done!"
