name: Keep App Alive

on:
  schedule:
    - cron: '*/5 * * * *'    # Har 5 minute auto-run
  workflow_dispatch:          # Manual run ke liye

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping App
        run: |
          echo "⏰ $(date): Pinging app..."
          curl -s -L --max-redirs 20 "https://leveluts.streamlit.app/?auto_login=true&code=UTS-ADMIN001"
          echo "✅ $(date): Done!"
