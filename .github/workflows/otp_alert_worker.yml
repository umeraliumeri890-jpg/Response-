# Headless OTP → WhatsApp alert worker (no Streamlit / no browser).
# Real 24/7 engine. HTTP keep-alive pings cannot run Streamlit alert logic.
name: OTP WhatsApp Alert Worker

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Force send even if cooldown active"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  # External cron (cron-job.org) ONLY
  repository_dispatch:
    types: [otp_alert_tick]

concurrency:
  group: otp-alert-worker
  cancel-in-progress: true

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install worker deps
        run: |
          python -m pip install --upgrade pip
          pip install "pandas>=2.1.0" "requests>=2.31.0" "phonenumbers>=8.13.0" "urllib3>=2.0.0"

      - name: Restore alert state
        uses: actions/cache/restore@v4
        with:
          path: data/alert_state.json
          key: alert-state-${{ github.run_id }}
          restore-keys: |
            alert-state-

      - name: Ensure data dir
        run: |
          mkdir -p data
          if [ ! -f data/alert_state.json ]; then
            echo '{"cooldown_until":0,"last_cli":"","last_hash":"","last_sent":0,"history":[]}' > data/alert_state.json
          fi
          echo "=== alert state BEFORE ==="
          cat data/alert_state.json

      - name: Run OTP alert worker
        env:
          ALERT_STATE_PATH: data/alert_state.json
          LAMIX_URL: ${{ secrets.LAMIX_URL }}
          LAMIX_TOKEN: ${{ secrets.LAMIX_TOKEN }}
          PURPLE_URL: ${{ secrets.PURPLE_URL }}
          PURPLE_TOKEN: ${{ secrets.PURPLE_TOKEN }}
          API_TIMEOUT: ${{ secrets.API_TIMEOUT }}
          API_RETRIES: ${{ secrets.API_RETRIES }}
          LAMIX_RECORDS: ${{ secrets.LAMIX_RECORDS }}
          PURPLE_RECORDS: ${{ secrets.PURPLE_RECORDS }}
          PURPLE_LOOKBACK_DAYS: ${{ secrets.PURPLE_LOOKBACK_DAYS }}
          WHATSAPP_ALERTS_ENABLED: ${{ secrets.WHATSAPP_ALERTS_ENABLED }}
          WHATSAPP_THRESHOLD: ${{ secrets.WHATSAPP_THRESHOLD }}
          WHATSAPP_WINDOW_MIN: ${{ secrets.WHATSAPP_WINDOW_MIN }}
          WHATSAPP_COOLDOWN_MIN: ${{ secrets.WHATSAPP_COOLDOWN_MIN }}
          WHATSAPP_MAX_ALERTS_PER_RUN: ${{ secrets.WHATSAPP_MAX_ALERTS_PER_RUN }}
          WHATSAPP_TOP_N: ${{ secrets.WHATSAPP_TOP_N }}
          WHATSAPP_PROVIDER: ${{ secrets.WHATSAPP_PROVIDER }}
          WHATSAPP_WEBHOOK_URL: ${{ secrets.WHATSAPP_WEBHOOK_URL }}
          GREENAPI_ID_INSTANCE: ${{ secrets.GREENAPI_ID_INSTANCE }}
          GREENAPI_API_TOKEN: ${{ secrets.GREENAPI_API_TOKEN }}
          GREENAPI_API_URL: ${{ secrets.GREENAPI_API_URL }}
          GREENAPI_GROUP_ID: ${{ secrets.GREENAPI_GROUP_ID }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          if [ "${{ github.event_name }}" = "repository_dispatch" ] && [ "${{ github.event.client_payload.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          echo "event=${{ github.event_name }} force_flag=${FORCE_FLAG:-none}"
          python alert_worker.py $FORCE_FLAG
          echo "=== alert state AFTER ==="
          cat data/alert_state.json

      - name: Save alert state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/alert_state.json
          key: alert-state-${{ github.run_id }}

      - name: Upload alert state artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alert-state
          path: data/alert_state.json
          retention-days: 7
